# Cloudflare Worker configuration for the Connor Family Hub backend.
#
# PLACEHOLDERS marked TODO must be filled in during Cloudflare setup.
# See docs/SETUP.md for step-by-step instructions.

name = "connor-family-hub"
main = "src/index.js"
compatibility_date = "2026-05-19"

# --- KV namespace binding ---------------------------------------------------
# Create the namespace with:  wrangler kv namespace create FAMILY_HUB_KV
# Then paste the returned id below, replacing TODO.
[[kv_namespaces]]
binding = "FAMILY_HUB_KV"
id = "33a7160b8d84400c87051ce1ebbaf75e"

# --- Local development ------------------------------------------------------
# `wrangler dev` runs the Worker locally. A local KV simulation is used
# automatically; no production data is touched.
[dev]
port = 8787

# --- Teller mTLS certificate ------------------------------------------------
# Uploaded with: wrangler mtls-certificate upload --cert certificate.pem --key private_key.pem --name teller-cert
# List existing: wrangler mtls-certificate list
[[mtls_certificates]]
binding = "TELLER_CERT"
certificate_id = "92b69536-800c-4604-8822-736e5187342a"

# --- Notes ------------------------------------------------------------------
# Secrets are NOT stored in this file. Set them with: wrangler secret put <NAME>
# Required secrets:
#   TELLER_APP_ID          — from teller.io/settings/application
#   TELLER_TOKEN_SIGNING_KEY — Ed25519 public key from teller.io/settings/application
